# Netlify configuration — pixeldividend.com
#
# The primary domain is set in the Netlify UI (Domain management → set
# pixeldividend.com as primary); Netlify then redirects www → apex on its own,
# which is why there is no hand-written www rule here. A manual one would
# fight it.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ / 22+. Pin it so a Netlify default bump cannot
  # silently break the build.
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Deploy previews and branch builds get the same treatment as production.
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# ------------------------------------------------------------------
# SPA fallback. The app is one page with in-memory routing (attract →
# connect → play), so every path must serve index.html rather than 404.
# ------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------
# Headers
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No camera, mic or geolocation is ever used. Payment is left alone
    # because wallet extensions can rely on it.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML entry must never be cached, or a deploy would not reach anyone.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
